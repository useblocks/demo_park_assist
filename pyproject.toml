[project]
name = "park-assist-demo-docs"
version = "0.1.0"
description = "Sphinx documentation build dependencies for Park Assist Demo"
requires-python = ">=3.10"

dependencies = [
    "sphinx>=7.0",
    "sphinx-needs>=4.0",
    "sphinxcontrib-mermaid>=0.9",
    "sphinx-codelinks>=0.1",
    "sphinxcontrib-plantuml>=0.30",
    "pillow>=10.0",
    "furo>=2024.0.0",
    "pytest>=8.0",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
